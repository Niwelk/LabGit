---
- name: Deploy app to VM
  hosts: vm
  become: true
  vars:
    app_dir: /home/ubuntu/app
    repo_root: "{{ playbook_dir }}/.."

  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker and Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Add ubuntu to docker group
      ansible.builtin.user:
        name: ubuntu
        groups: docker
        append: true

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu

    - name: Copy compose.yaml
      ansible.builtin.copy:
        src: "{{ repo_root }}/compose.yaml"
        dest: "{{ app_dir }}/compose.yaml"
        owner: ubuntu
        group: ubuntu

    - name: Copy front
      ansible.builtin.copy:
        src: "{{ repo_root }}/front/"
        dest: "{{ app_dir }}/front/"
        owner: ubuntu
        group: ubuntu

    - name: Copy back
      ansible.builtin.copy:
        src: "{{ repo_root }}/back/"
        dest: "{{ app_dir }}/back/"
        owner: ubuntu
        group: ubuntu

    - name: Start application with Compose
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        build: always
        state: present

    - name: Check backend through frontend
      ansible.builtin.uri:
        url: http://localhost/api/hello
        status_code: 200
      register: api
      retries: 10
      delay: 3
      until: api.status == 200
